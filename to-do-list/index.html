<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To-Do List - Users</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>

    <body class="d-flex flex-column min-vh-100">

        <header class="app-header text-center py-3">
            <h1>To-Do List</h1>
            <p class="mb-0 fs-5">Select a user to manage their lists</p>
        </header>

        <main class="flex-grow-1 container" style="max-width: 1100px;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Users</h2>
                <button class="btn btn-app px-4" data-bs-toggle="modal" data-bs-target="#modal-new-user">+ New User</button>
            </div>

            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4">

                <div class="col">
                    <div class="user-card card text-center p-4 h-100 shadow-sm">
                        <div class="user-avatar mb-2">J</div>
                        <h3 class="fs-5">Júlia</h3>
                        <p class="text-muted-app">3 lists · 8 tasks</p>
                        <div class="d-flex flex-column gap-2 mt-auto">
                            <a href="user.html?user=julia"><button class="btn btn-app w-100">View Lists</button></a>
                            <button class="btn btn-app-danger w-100">Remove User</button>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="user-card card text-center p-4 h-100 shadow-sm">
                        <div class="user-avatar mb-2">J</div>
                        <h3 class="fs-5">Jessica</h3>
                        <p class="text-muted-app">2 lists · 5 tasks</p>
                        <div class="d-flex flex-column gap-2 mt-auto">
                            <a href="user.html?user=jessica"><button class="btn btn-app w-100">View Lists</button></a>
                            <button class="btn btn-app-danger w-100">Remove User</button>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="user-card card text-center p-4 h-100 shadow-sm">
                        <div class="user-avatar mb-2">B</div>
                        <h3 class="fs-5">Bruno</h3>
                        <p class="text-muted-app">1 list · 4 tasks</p>
                        <div class="d-flex flex-column gap-2 mt-auto">
                            <a href="user.html?user=bruno"><button class="btn btn-app w-100">View Lists</button></a>
                            <button class="btn btn-app-danger w-100">Remove User</button>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="user-card card text-center p-4 h-100 shadow-sm">
                        <div class="user-avatar mb-2">V</div>
                        <h3 class="fs-5">Victoria</h3>
                        <p class="text-muted-app">2 lists · 6 tasks</p>
                        <div class="d-flex flex-column gap-2 mt-auto">
                            <a href="user.html?user=victoria"><button class="btn btn-app w-100">View Lists</button></a>
                            <button class="btn btn-app-danger w-100">Remove User</button>
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <!-- Modal: New User -->
        <div class="modal fade" id="modal-new-user">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content p-2">
                    <div class="modal-header border-0">
                        <h5 class="modal-title" id="modal-new-user-label">New User</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input class="modal-input" type="text" placeholder="User name"/>
                    </div>
                    <div class="modal-footer border-0">
                        <button class="btn btn-app-danger" data-bs-dismiss="modal">Cancel</button>
                        <button class="btn btn-app">Create</button>
                    </div>
                </div>
            </div>
        </div>

        <footer class="text-center py-4 small">
            <p>&copy; 2026 To-Do List</p>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
