<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To-Do List - Tasks</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>

    <body class="d-flex flex-column min-vh-100">

        <header class="app-header text-center py-3">
            <h1>To-Do List</h1>
            <p class="mb-0 fs-5">Work Tasks</p>
        </header>

        <main class="flex-grow-1 container" style="max-width: 700px;">
            <nav class="breadcrumb-nav mb-3">
                <a class="breadcrumb-link" href="index.html">Users</a> / <a class="breadcrumb-link" href="user.html">Júlia</a> / Work Tasks
            </nav>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>Work Tasks</h2>
            </div>

            <div class="card shadow-sm p-3 mb-3 d-flex flex-row justify-content-between align-items-center list-summary-row">
                <p class="mb-0 text-muted small">3 tasks · 1 completed</p>
                <div class="task-progress-bar">
                    <div class="task-progress-fill" style="width: 33%"></div>
                </div>
            </div>

            <div class="d-flex gap-2 mb-3 add-task-row">
                <input class="add-task-input" type="text" placeholder="Add a new task..."/>
                <button class="btn btn-app px-4">+ Add</button>
            </div>

            <p class="section-title">Pending</p>

            <div class="d-flex flex-column gap-2">

                <div class="task-item">
                    <div class="task-checkbox"></div>
                    <span class="task-label">Review pull request from the team</span>
                    <div>
                        <button class="btn btn-app-danger btn-sm">Remove</button>
                    </div>
                </div>

                <div class="task-item">
                    <div class="task-checkbox"></div>
                    <span class="task-label">Update project documentation</span>
                    <div>
                        <button class="btn btn-app-danger btn-sm">Remove</button>
                    </div>
                </div>

                <p class="section-title">Completed</p>

                <div class="task-item task-completed">
                    <div class="task-checkbox">✓</div>
                    <span class="task-label">Set up the development environment</span>
                    <div>
                        <button class="btn btn-app-danger btn-sm">Remove</button>
                    </div>
                </div>

            </div>
        </main>

        <footer class="text-center py-4 small">
            <p>&copy; 2026 To-Do List</p>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            document.querySelectorAll('.task-checkbox').forEach(checkbox => {
                checkbox.addEventListener('click', () => {
                    const taskItem = checkbox.closest('.task-item');
                    const isCompleted = taskItem.classList.toggle('task-completed');
                    checkbox.textContent = isCompleted ? '✓' : '';
                });
            });
        </script>
    </body>
</html>
