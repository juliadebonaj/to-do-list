<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To-Do List - Lists</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">

    </head>

    <body class="d-flex flex-column min-vh-100">

        <header class="app-header text-center py-3">
            <h1>To-Do List</h1>
            <p class="mb-0 fs-5">Júlia's task lists</p>
        </header>

        <main class="flex-grow-1 container" style="max-width: 1100px;">
            <nav class="breadcrumb-nav mb-3">
                <a class="breadcrumb-link" href="index.html">Users</a> / Júlia
            </nav>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Júlia's Lists</h2>
                <button class="btn btn-app px-4" data-bs-toggle="modal" data-bs-target="#modal-new-list">+ New List</button>
            </div>

            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">

                <div class="col">
                    <div class="list-card card p-4 h-100 shadow-sm d-flex flex-column gap-2">
                        <h3>Work Tasks</h3>
                        <p class="list-meta">3 tasks · 1 completed</p>
                        <div class="task-progress-bar">
                            <div class="task-progress-fill" style="width: 33%"></div>
                        </div>
                        <div class="d-flex gap-2 mt-auto">
                            <a href="list.html?list=work"><button class="btn btn-app btn-sm">View Tasks</button></a>
                            <button class="btn btn-app-danger btn-sm">Remove</button>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="list-card card p-4 h-100 shadow-sm d-flex flex-column gap-2">
                        <h3>Studies</h3>
                        <p class="list-meta">4 tasks · 2 completed</p>
                        <div class="task-progress-bar">
                            <div class="task-progress-fill" style="width: 50%"></div>
                        </div>
                        <div class="d-flex gap-2 mt-auto">
                            <a href="list.html?list=studies"><button class="btn btn-app btn-sm">View Tasks</button></a>
                            <button class="btn btn-app-danger btn-sm">Remove</button>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="list-card card p-4 h-100 shadow-sm d-flex flex-column gap-2">
                        <h3>Personal</h3>
                        <p class="list-meta">1 task · 0 completed</p>
                        <div class="task-progress-bar">
                            <div class="task-progress-fill" style="width: 0%"></div>
                        </div>
                        <div class="d-flex gap-2 mt-auto">
                            <a href="list.html?list=personal"><button class="btn btn-app btn-sm">View Tasks</button></a>
                            <button class="btn btn-app-danger btn-sm">Remove</button>
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <!-- Modal: New List -->
        <div class="modal fade" id="modal-new-list">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content p-2">
                    <div class="modal-header border-0">
                        <h5 class="modal-title" id="modal-new-list-label">New List</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input class="modal-input" type="text" placeholder="List name"/>
                    </div>
                    <div class="modal-footer border-0">
                        <button class="btn btn-app-danger" data-bs-dismiss="modal">Cancel</button>
                        <button class="btn btn-app">Create</button>
                    </div>
                </div>
            </div>
        </div>

        <footer class="text-center py-4 small">
            <p>&copy; 2026 To-Do List</p>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
